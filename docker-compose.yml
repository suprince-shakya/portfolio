services:
  portfolio:
    container_name: portfolio
    image: ghcr.io/suprince-shakya/portfolio-ghcr:latest
    ports:
      - 3004:3000
    volumes:
      - ./public:/app/public
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    restart: on-failure
    networks:
      - shared-mongo-network

networks:
  shared-mongo-network:
    external: true